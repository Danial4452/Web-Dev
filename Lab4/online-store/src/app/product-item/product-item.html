<div class="product-card">
  <div class="main-image-box">
    <img [src]="selectedImage" [alt]="product.name" class="main-photo">
  </div>

  <div class="gallery-strip">
    <div class="thumb-wrapper" 
         [class.active]="selectedImage === product.image" 
         (click)="changeImage(product.image)">
      <img [src]="product.image" class="mini-photo">
    </div>

    @for (img of product.images; track img) {
      <div class="thumb-wrapper" 
           [class.active]="selectedImage === img" 
           (click)="changeImage(img)">
        <img [src]="img" class="mini-photo">
      </div>
    }
  </div>

  <div class="content-box">
    <h3 class="product-title">{{ product.name }}</h3>
    <p class="product-desc">{{ product.description }}</p>
    
    <div class="stats-row">
      <div class="rating-stars">
        @for (star of [1,2,3,4,5]; track star) {
          <span [style.color]="star <= product.rating ? '#ffc107' : '#e4e5e9'">★</span>
        }
        <span class="rating-value">{{ product.rating }}</span>
      </div>
      <span class="price-tag">{{ product.price.toLocaleString() }} ₸</span>
    </div>
  </div>

  <div class="button-group">
    <button class="share-btn wa" (click)="share('wa')">
      <span>WhatsApp</span>
    </button>
    <button class="share-btn tg" (click)="share('tg')">
      <span>Telegram</span>
    </button>
  </div>
  
  <a [href]="product.link" target="_blank" class="kaspi-buy-link">Купить на Kaspi</a>
</div>
